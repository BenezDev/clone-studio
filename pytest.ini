[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --tb=short
markers =
    slow: leva mais de alguns segundos
    needs_ffmpeg: exige FFmpeg no PATH
    needs_tts: exige o ambiente e os pesos do TTS
    needs_lipsync: exige o ambiente e os pesos do MuseTalk
